# Memory budget — the production VM has 1 GB of physical RAM.
#
# Limits are ceilings, not reservations: their job is to bound the blast radius
# when something leaks, so a single sick container gets killed instead of the
# kernel's OOM killer picking an arbitrary victim (Postgres being the worst
# case). That only works if the ceilings FIT IN THE HOST. They must therefore
# sum to less than physical RAM, with room left for the OS and the Docker
# daemon (~150 MB).
#
#   postgres 288M + redis 80M + api 200M + scraper 96M
#   + notifier 80M + bot-poller 80M + caddy 48M = 872M
#
# Keep this sum under ~900M when changing any limit below. Steady-state usage is
# far lower (idle Go services sit at ~30 MB RSS); the headroom absorbs spikes.
# The VM should also have 1–2 GB of swap with vm.swappiness=10 as a shock
# absorber for brief spikes — swap is slow, but slow beats killed.
services:
  postgres:
    image: postgres:17-alpine
    container_name: carwatch-pg
    networks:
      - carwatch-net
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: carwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: carwatch
      TZ: Asia/Jerusalem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 288M

  redis:
    image: redis:7-alpine
    container_name: carwatch-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    networks:
      - carwatch-net
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 80M

  api:
    image: ghcr.io/danielsio/carwatch:${CARWATCH_IMAGE_TAG:?CARWATCH_IMAGE_TAG must be set}
    container_name: carwatch-api
    entrypoint: ["/usr/local/bin/api-server"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - carwatch-net
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./migrations:/migrations:ro
      - ./firebase-sa.json:/config/firebase-sa.json:ro
    environment:
      - TZ=Asia/Jerusalem
      - CARWATCH_DOMAIN=${CARWATCH_DOMAIN:?CARWATCH_DOMAIN must be set}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - TELEMETRY_AUTH_TOKEN=${TELEMETRY_AUTH_TOKEN:?TELEMETRY_AUTH_TOKEN must be set}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 200M

  bot-poller:
    image: ghcr.io/danielsio/carwatch:${CARWATCH_IMAGE_TAG:?CARWATCH_IMAGE_TAG must be set}
    container_name: carwatch-bot-poller
    entrypoint: ["/usr/local/bin/bot-poller"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - carwatch-net
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./migrations:/migrations:ro
    environment:
      - TZ=Asia/Jerusalem
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 80M

  scraper:
    image: ghcr.io/danielsio/carwatch:${CARWATCH_IMAGE_TAG:?CARWATCH_IMAGE_TAG must be set}
    container_name: carwatch-scraper
    entrypoint: ["/usr/local/bin/scraper"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Plain /tmp: the exec-able tmpfs, /dev/shm and the writable home were all
    # for the headless Chromium the image no longer ships (see Dockerfile).
    tmpfs:
      - /tmp
    networks:
      - carwatch-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./migrations:/migrations:ro
    environment:
      - TZ=Asia/Jerusalem
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 96M

  notifier:
    image: ghcr.io/danielsio/carwatch:${CARWATCH_IMAGE_TAG:?CARWATCH_IMAGE_TAG must be set}
    container_name: carwatch-notifier
    entrypoint: ["/usr/local/bin/notifier"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - carwatch-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config.yaml:/config.yaml:ro
    environment:
      - TZ=Asia/Jerusalem
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 80M

  # NOTE: the per-item km `enricher` service was retired once the browser
  # extension took over ingestion (it fetches item detail + km from a real
  # Yad2 tab; Yad2's Radware bot-manager blocks server-side item fetches).
  # The `scraper` container is kept because its scheduler also runs digest
  # flushing and dedup/price pruning — not just fetching.

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    networks:
      - carwatch-net
    # Deliberately NOT gated on `api: condition: service_healthy`. Caddy is the
    # only thing holding the domain and the ACME certificate: if it waits for a
    # healthy API, then a crash-looping API (bad config, failed migration) means
    # the domain answers nothing at all — and TLS renewal cannot run, so a long
    # outage can end with an expired certificate on top of the original fault.
    # Proxying to a dead upstream returns 502, which is strictly better: the
    # site is reachable, the failure is legible, and certs keep renewing.
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - CARWATCH_DOMAIN=${CARWATCH_DOMAIN:?CARWATCH_DOMAIN must be set}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 48M

networks:
  carwatch-net:
    name: carwatch-net
    external: true

volumes:
  pgdata:
    name: carwatch_pgdata
  redis-data:
  caddy-data:
  caddy-config:
