services:
  postgres:
    image: postgres:17-alpine
    container_name: carwatch-pg
    networks:
      - carwatch-net
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: carwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: carwatch
      TZ: Asia/Jerusalem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: carwatch-redis
    networks:
      - carwatch-net
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

  # All-in-one mode: runs API + scheduler + consumer in a single process.
  # For split deployment, replace this with api/scraper/notifier services below.
  carwatch:
    image: ghcr.io/danielsio/carwatch:latest
    container_name: carwatch
    networks:
      - carwatch-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./migrations:/migrations:ro
      - ./firebase-sa.json:/config/firebase-sa.json:ro
    environment:
      - TZ=Asia/Jerusalem
      - CARWATCH_DOMAIN=${CARWATCH_DOMAIN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

