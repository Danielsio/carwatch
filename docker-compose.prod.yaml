services:
  postgres:
    image: postgres:17-alpine
    container_name: carwatch-pg
    networks:
      - carwatch-net
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: carwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: carwatch
      TZ: Asia/Jerusalem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  carwatch:
    image: ghcr.io/danielsio/carwatch:latest
    container_name: carwatch
    networks:
      - carwatch-net
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - carwatch-data:/data
      - ./config.yaml:/config.yaml:ro
      - ./migrations:/migrations:ro
      - ./firebase-sa.json:/config/firebase-sa.json:ro
    environment:
      - TZ=Asia/Jerusalem
      - CARWATCH_DOMAIN=${CARWATCH_DOMAIN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    networks:
      - carwatch-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - CARWATCH_DOMAIN=${CARWATCH_DOMAIN}
    restart: unless-stopped

  watchtower:
    # Pin to specific version; :latest + Docker socket = supply chain risk
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Requires: docker login ghcr.io (creates ~/.docker/config.json)
      - ${HOME}/.docker:/etc/watchtower-docker:ro
    environment:
      - DOCKER_CONFIG=/etc/watchtower-docker
      - DOCKER_API_VERSION=1.45
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=true
    restart: unless-stopped

networks:
  carwatch-net:
    name: carwatch-net
    external: true

volumes:
  carwatch-data:
    name: carwatch_carwatch-data
  pgdata:
    name: carwatch_pgdata
  caddy-data:
  caddy-config:
