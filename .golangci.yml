version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - bodyclose
    - nilerr
    - errorlint
  exclusions:
    rules:
      # Hardcoded bind addresses are intentional defaults
      - linters:
          - gosec
        text: "G102:"
      # net/http server with default timeouts is acceptable for internal use behind Caddy
      - linters:
          - gosec
        text: "G114:"
      # Integer overflow conversion in non-critical paths
      - linters:
          - gosec
        text: "G115:"
      # Config file path read from trusted YAML config, not user input
      - linters:
          - gosec
        text: "G304:"
      # SQL string construction using parameterized placeholders is safe
      - linters:
          - gosec
        text: "G201:|G202:"
      # Test file permissions are not security-sensitive
      - linters:
          - gosec
        text: "G306:"
        path: _test\.go
      # Test credentials are not real secrets
      - linters:
          - gosec
        text: "G101:"
        path: _test\.go
      # math/rand is acceptable for jitter/shuffle (not crypto)
      - linters:
          - gosec
        text: "G404:"

formatters:
  enable:
    - gofmt
