services:
  postgres:
    image: postgres:17-alpine
    container_name: carwatch-dev-pg
    ports:
      - "5432:5432"
    volumes:
      - dev-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: carwatch
      POSTGRES_PASSWORD: carwatch
      POSTGRES_DB: carwatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwatch"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  dev-pgdata:
