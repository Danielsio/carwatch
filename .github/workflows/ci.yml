name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'Caddyfile'
      - '.github/workflows/**'
      - 'docker-compose*.yaml'
      - 'web/**'

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050 # v3
        id: filter
        with:
          filters: |
            go:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
            web:
              - 'web/**'
            infra:
              - 'Dockerfile'
              - 'Caddyfile'
              - '.github/workflows/**'
              - 'docker-compose*.yaml'

  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub web/dist for embed
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.4
          args: --timeout=5m
      - name: Validate production compose env contract
        run: |
          CARWATCH_IMAGE_TAG=1.2.3 \
          POSTGRES_PASSWORD=test-postgres \
          REDIS_PASSWORD=test-redis \
          TELEMETRY_AUTH_TOKEN=test-telemetry \
          CARWATCH_DOMAIN=example.com \
          TELEGRAM_BOT_TOKEN=test-token \
          docker compose -f docker-compose.prod.yaml config >/dev/null
      - name: Verify CARWATCH_IMAGE_TAG is required in production compose
        run: |
          set +e
          POSTGRES_PASSWORD=test-postgres \
          REDIS_PASSWORD=test-redis \
          TELEMETRY_AUTH_TOKEN=test-telemetry \
          CARWATCH_DOMAIN=example.com \
          TELEGRAM_BOT_TOKEN=test-token \
          docker compose -f docker-compose.prod.yaml config >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Expected docker compose config to fail without CARWATCH_IMAGE_TAG"
            exit 1
          fi
      - name: Verify REDIS_PASSWORD is required in production compose
        run: |
          set +e
          CARWATCH_IMAGE_TAG=1.2.3 \
          POSTGRES_PASSWORD=test-postgres \
          TELEMETRY_AUTH_TOKEN=test-telemetry \
          CARWATCH_DOMAIN=example.com \
          TELEGRAM_BOT_TOKEN=test-token \
          docker compose -f docker-compose.prod.yaml config >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Expected docker compose config to fail without REDIS_PASSWORD"
            exit 1
          fi
      - name: Verify TELEMETRY_AUTH_TOKEN is required in production compose
        run: |
          set +e
          CARWATCH_IMAGE_TAG=1.2.3 \
          POSTGRES_PASSWORD=test-postgres \
          REDIS_PASSWORD=test-redis \
          CARWATCH_DOMAIN=example.com \
          TELEGRAM_BOT_TOKEN=test-token \
          docker compose -f docker-compose.prod.yaml config >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Expected docker compose config to fail without TELEMETRY_AUTH_TOKEN"
            exit 1
          fi
      - name: Enforce immutable image tags in production compose
        run: |
          if grep -n "ghcr.io/danielsio/carwatch:latest" docker-compose.prod.yaml; then
            echo "docker-compose.prod.yaml must not pin app services to :latest"
            exit 1
          fi
      - name: Ensure watchtower does not auto-update app containers
        run: |
          if grep -n "com.centurylinklabs.watchtower.enable=true" docker-compose.prod.yaml; then
            echo "watchtower auto-update labels must be removed from app services"
            exit 1
          fi
      - name: Ensure all app services use CARWATCH_IMAGE_TAG
        run: |
          count=$(grep -c "ghcr.io/danielsio/carwatch:\${CARWATCH_IMAGE_TAG" docker-compose.prod.yaml || true)
          if [ "$count" -ne 5 ]; then
            echo "Expected api/bot-poller/scraper/notifier/enricher to use CARWATCH_IMAGE_TAG (found $count)"
            exit 1
          fi
      - name: Verify compose topology has expected app services
        run: |
          EXPECTED_SERVICES="api bot-poller scraper notifier enricher"
          CARWATCH_IMAGE_TAG=test \
          POSTGRES_PASSWORD=test \
          REDIS_PASSWORD=test \
          TELEMETRY_AUTH_TOKEN=test \
          CARWATCH_DOMAIN=example.com \
          TELEGRAM_BOT_TOKEN=test \
          docker compose -f docker-compose.prod.yaml config --services > /tmp/compose-services.txt
          for svc in $EXPECTED_SERVICES; do
            if ! grep -q "^${svc}$" /tmp/compose-services.txt; then
              echo "::error::Missing expected app service: ${svc}"
              exit 1
            fi
          done
          echo "All expected app services present ✓"
      - name: Verify all app services define healthchecks
        run: |
          APP_SERVICES="api bot-poller scraper notifier enricher"
          CARWATCH_IMAGE_TAG=test \
          POSTGRES_PASSWORD=test \
          REDIS_PASSWORD=test \
          TELEMETRY_AUTH_TOKEN=test \
          CARWATCH_DOMAIN=example.com \
          TELEGRAM_BOT_TOKEN=test \
          docker compose -f docker-compose.prod.yaml config > /tmp/compose-full.yaml
          for svc in $APP_SERVICES; do
            if ! grep -A40 "^  ${svc}:" /tmp/compose-full.yaml | grep -q "healthcheck:"; then
              echo "::error::Service ${svc} is missing a healthcheck"
              exit 1
            fi
          done
          echo "All app services have healthchecks ✓"
      - name: Verify all timestamp columns use TIMESTAMPTZ
        run: |
          # Exclude migration 000009 (corrected by migration 000016)
          if grep -Pn '\bTIMESTAMP\b' migrations/*.up.sql | grep -v 'TIMESTAMPTZ' | grep -v '000009_'; then
            echo "::error::Found TIMESTAMP columns that should be TIMESTAMPTZ"
            exit 1
          fi
          echo "All temporal columns use TIMESTAMPTZ ✓"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.infra == 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: carwatch
          POSTGRES_PASSWORD: carwatch
          POSTGRES_DB: carwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub web/dist for embed
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html
      - name: Run tests
        run: make test
        env:
          TEST_POSTGRES_DSN: postgres://carwatch:carwatch@localhost:5432/carwatch_test?sslmode=disable
      - name: Run e2e tests
        timeout-minutes: 5
        run: make test-e2e
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=.coverage/coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=60
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below minimum threshold ${THRESHOLD}%"
            exit 1
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: .coverage/

  web:
    name: Web Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: cd web && npm ci
      - name: Lint
        run: cd web && npm run lint
      - name: Type check
        run: cd web && npx tsc -b
      - name: Test
        run: cd web && npm test
      - name: Build
        run: cd web && npm run build
      - name: Upload web dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: web/dist

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, lint, test, web]
    if: |
      always() &&
      (needs.changes.outputs.go == 'true' || needs.changes.outputs.infra == 'true') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download web dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: web/dist
        continue-on-error: true
      - name: Stub web/dist if not built
        run: |
          if [ ! -f web/dist/index.html ]; then
            mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html
          fi
      - name: Build all binaries
        run: make build-all
      - name: Build Docker image
        run: docker build -t carwatch:ci .
