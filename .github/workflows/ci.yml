name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'Caddyfile'
      - '.github/workflows/**'
      - 'docker-compose*.yaml'
      - 'web/**'
      - 'extension/**'

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
      extension: ${{ steps.filter.outputs.extension }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            go:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
            web:
              - 'web/**'
            extension:
              - 'extension/**'
            infra:
              - 'Dockerfile'
              - 'Caddyfile'
              - '.github/workflows/**'
              - 'docker-compose*.yaml'

  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub web/dist for embed
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.4
          args: --timeout=5m
      - name: Vulnerability scan (govulncheck)
        if: needs.changes.outputs.go == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Validate production compose contract
        run: bash scripts/validate-compose.sh
      - name: Verify all timestamp columns use TIMESTAMPTZ
        run: |
          # Exclude migration 000009 (corrected by migration 000016)
          if grep -Pn '\bTIMESTAMP\b' migrations/*.up.sql | grep -v 'TIMESTAMPTZ' | grep -v '000009_'; then
            echo "::error::Found TIMESTAMP columns that should be TIMESTAMPTZ"
            exit 1
          fi
          echo "All temporal columns use TIMESTAMPTZ ✓"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.infra == 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: carwatch
          POSTGRES_PASSWORD: carwatch
          POSTGRES_DB: carwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub web/dist for embed
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html
      - name: Run tests
        run: make test
        env:
          TEST_POSTGRES_DSN: postgres://carwatch:carwatch@localhost:5432/carwatch_test?sslmode=disable
      - name: Race detector on concurrency hotspots
        run: go test -race -count=1 ./internal/scheduler/... ./internal/fetcher/... ./internal/broker/...
        env:
          TEST_POSTGRES_DSN: postgres://carwatch:carwatch@localhost:5432/carwatch_test?sslmode=disable
      - name: Run e2e tests
        timeout-minutes: 5
        run: make test-e2e
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=.coverage/coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=60
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below minimum threshold ${THRESHOLD}%"
            exit 1
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: .coverage/

  extension:
    name: Extension Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      # The extension is the ONLY path listings enter the system by, and its
      # parser encodes assumptions about a third-party payload that changes
      # without notice. No npm install: the suite runs on node:test alone.
      - name: Test
        run: cd extension && npm test

  web:
    name: Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: cd web && npm ci
      - name: Lint
        run: cd web && npm run lint
      - name: Type check
        run: cd web && npx tsc -b
      - name: Test
        run: cd web && npm test
      - name: Build
        run: cd web && npm run build
      - name: Upload web dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: web/dist

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, lint, test, web]
    if: |
      always() &&
      (needs.changes.outputs.go == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.web == 'true') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download web dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: web/dist
        continue-on-error: true
      - name: Stub web/dist if not built
        run: |
          if [ ! -f web/dist/index.html ]; then
            mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html
          fi
      - name: Build all binaries
        run: make build-all
      - name: Build Docker image
        run: docker build -t carwatch:ci .
