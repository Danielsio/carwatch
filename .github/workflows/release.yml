name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type (overrides commit message detection)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

concurrency:
  group: release-prod
  cancel-in-progress: false

jobs:
  release:
    name: Version, Build & Push
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version bump
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Manual dispatch: use the explicit bump_type input
          if [ -n "${{ inputs.bump_type }}" ]; then
            BUMP="${{ inputs.bump_type }}"
            echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
            echo "Bump type (manual): $BUMP"
            exit 0
          fi

          # Push trigger: parse from commit message
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)
          echo "Commit message: $COMMIT_MSG"

          # For "Merge pull request #N" commits, extract the PR title
          if echo "$COMMIT_MSG" | grep -qE '^Merge pull request #'; then
            PR_NUM=$(echo "$COMMIT_MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
            MSG=$(gh pr view "$PR_NUM" --json title -q .title 2>/dev/null || echo "$COMMIT_MSG")
          else
            MSG="$COMMIT_MSG"
          fi
          echo "Parsed message: $MSG"

          if echo "$MSG" | grep -qiE '(^[a-z]+(\(.+\))?!:)' || echo "$COMMIT_BODY" | grep -qiE 'BREAKING CHANGE'; then
            BUMP=major
          elif echo "$MSG" | grep -qiE '^feat(\(.+\))?:'; then
            BUMP=minor
          else
            BUMP=patch
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bump type: $BUMP"

      - name: Compute next version from tags
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            CURRENT="0.0.0"
          else
            CURRENT="${LATEST_TAG#v}"
          fi
          echo "Current version: $CURRENT"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ steps.bump.outputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=${{ steps.version.outputs.version }}
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/danielsio/carwatch:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: |
            docker-compose.prod.yaml
            migrations

      - name: Sync compose file and migrations to VM
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yaml,migrations"
          target: ~/carwatch/

      - name: Prepare immutable deploy tag and rollback marker
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "$HOME/carwatch"
            if [ ! -f .env ]; then
              echo ".env is missing in ~/carwatch"
              exit 1
            fi

            if [ -f .deploy_recreate_started ] && [ -s prev_image_tag ]; then
              PREV_TAG=$(cat prev_image_tag)
              PREV_TAG="${PREV_TAG##*:}"
            else
              PREV_TAG=$(awk -F= '/^CARWATCH_IMAGE_TAG=/{print $2}' .env | tail -1 | tr -d '"' || true)
              if [ -z "$PREV_TAG" ]; then
                PREV_TAG=$(docker exec carwatch-api api-server -version 2>/dev/null | awk '{print $2}' || true)
              fi
              if [ -z "$PREV_TAG" ]; then
                PREV_TAG=none
              fi
            fi
            echo "$PREV_TAG" > prev_image_tag

            NEW_TAG="${{ needs.release.outputs.version }}"
            echo "$NEW_TAG" > next_image_tag

            echo "Saved previous image tag: $PREV_TAG"
            echo "Prepared new image tag: $NEW_TAG"

      - name: Skip deploy if superseded by a newer release
        id: stale-check
        run: |
          git fetch origin main --quiet
          LATEST=$(git rev-parse origin/main)
          if [ "$LATEST" != "$GITHUB_SHA" ]; then
            echo "This release ($GITHUB_SHA) is superseded by $LATEST — skipping deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull, recreate and health-check
        if: steps.stale-check.outputs.skip != 'true'
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "$HOME/carwatch"
            if [ -f .env ]; then
              set -a; source .env; set +a
            else
              echo ".env is missing in ~/carwatch"
              exit 1
            fi
            APP_SERVICES="postgres redis api bot-poller scraper notifier enricher"
            if [ -f .deploy_recreate_started ]; then
              echo "==> Found stale deploy marker; restoring previously known-good services before continuing"
              RECOVERY_TAG=$(cat prev_image_tag 2>/dev/null || echo 'none')
              RECOVERY_TAG="${RECOVERY_TAG##*:}"
              if [ "$RECOVERY_TAG" = "none" ] || [ -z "$RECOVERY_TAG" ]; then
                RECOVERY_TAG=$(awk -F= '/^CARWATCH_IMAGE_TAG=/{print $2}' .env | tail -1 | tr -d '"' || true)
              fi
              if [ -n "$RECOVERY_TAG" ] && [ "$RECOVERY_TAG" != "none" ]; then
                CARWATCH_IMAGE_TAG="$RECOVERY_TAG" docker compose -f docker-compose.prod.yaml pull $APP_SERVICES || true
                CARWATCH_IMAGE_TAG="$RECOVERY_TAG" docker compose -f docker-compose.prod.yaml up -d $APP_SERVICES || true
              fi
              rm -f .deploy_recreate_started
            fi

            : "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in ~/carwatch/.env}"
            NEW_TAG=$(cat next_image_tag 2>/dev/null || true)
            if [ -z "$NEW_TAG" ]; then
              echo "next_image_tag is missing"
              exit 1
            fi
            if [ ! -f config.yaml ]; then
              echo "config.yaml is missing in ~/carwatch"
              exit 1
            fi
            if ! awk '
              /^[[:space:]]*redis:[[:space:]]*$/ { in_redis=1; next }
              in_redis && /^[^[:space:]]/ { in_redis=0 }
              in_redis && /^[[:space:]]*password:[[:space:]]*"\$\{REDIS_PASSWORD\}"[[:space:]]*$/ { found=1 }
              END { exit found ? 0 : 1 }
            ' config.yaml; then
              echo "config.yaml must include redis.password: \"\${REDIS_PASSWORD}\" before deploy"
              exit 1
            fi
            if ! awk '
              /^[[:space:]]*telemetry:[[:space:]]*$/ { in_telemetry=1; next }
              in_telemetry && /^[^[:space:]]/ { in_telemetry=0 }
              in_telemetry && /^[[:space:]]*auth_token:[[:space:]]*"\$\{TELEMETRY_AUTH_TOKEN\}"[[:space:]]*$/ { found=1 }
              END { exit found ? 0 : 1 }
            ' config.yaml; then
              echo "config.yaml must include telemetry.auth_token: \"\${TELEMETRY_AUTH_TOKEN}\" before deploy"
              exit 1
            fi

            # Ensure the shared network exists
            docker network create carwatch-net 2>/dev/null || true

            # Remove any legacy all-in-one container
            docker stop carwatch 2>/dev/null || true
            docker rm carwatch 2>/dev/null || true

            # Only manage app + infra services; watchtower and caddy are
            # long-lived infrastructure that must not be recreated on every deploy.

            echo "==> Pulling release image tag: $NEW_TAG"
            CARWATCH_IMAGE_TAG="$NEW_TAG" docker compose -f docker-compose.prod.yaml pull $APP_SERVICES

            # NOTE: Migrations run automatically on app startup.
            # The postgres.New() constructor runs golang-migrate/migrate before
            # returning, so no explicit migration step is needed here.

            echo "==> Recreating containers..."
            touch .deploy_recreate_started
            CARWATCH_IMAGE_TAG="$NEW_TAG" docker compose -f docker-compose.prod.yaml up -d $APP_SERVICES

            echo "==> Waiting for API health check..."
            for i in $(seq 1 15); do
              if docker exec carwatch-api wget -q --spider http://localhost:8080/healthz 2>/dev/null; then
                echo "==> Health check passed!"
                docker exec carwatch-api api-server -version
                break
              fi
              echo "    attempt $i/15 — waiting 5s..."
              sleep 5
            done
            if ! docker exec carwatch-api wget -q --spider http://localhost:8080/healthz 2>/dev/null; then
              echo "==> API health check failed after 75s"
              exit 1
            fi

            echo "==> Waiting for worker health checks..."
            for svc in bot-poller scraper notifier enricher; do
              container="carwatch-$svc"
              port=$(case "$svc" in
                bot-poller) echo 8082 ;;
                scraper) echo 8081 ;;
                notifier) echo 8083 ;;
                enricher) echo 8084 ;;
              esac)
              ok=0
              for i in $(seq 1 15); do
                if docker exec "$container" wget -q --spider "http://localhost:${port}/healthz" 2>/dev/null; then
                  ok=1
                  break
                fi
                echo "    $container attempt $i/15 — waiting 5s..."
                sleep 5
              done
              if [ "$ok" -ne 1 ]; then
                echo "==> Worker health check failed: $container"
                exit 1
              fi
            done
            echo "==> Worker health checks passed!"

            if grep -q '^CARWATCH_IMAGE_TAG=' .env; then
              sed -i "s/^CARWATCH_IMAGE_TAG=.*/CARWATCH_IMAGE_TAG=${NEW_TAG}/" .env
            else
              echo "CARWATCH_IMAGE_TAG=${NEW_TAG}" >> .env
            fi
            rm -f .deploy_recreate_started
            rm -f next_image_tag
            echo "==> Persisted CARWATCH_IMAGE_TAG=${NEW_TAG} in .env"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "$HOME/carwatch"
            if [ -f .env ]; then
              set -a; source .env; set +a
            fi
            if [ ! -f .deploy_recreate_started ]; then
              echo "==> Skipping rollback (deploy failed before container recreation)"
              exit 0
            fi
            PREV=$(cat prev_image_tag 2>/dev/null || echo 'none')
            PREV="${PREV##*:}"
            if [ "$PREV" != 'none' ]; then
              echo "==> Rolling back to previous image tag: $PREV"
              APP_SERVICES="postgres redis api bot-poller scraper notifier enricher"
              CARWATCH_IMAGE_TAG="$PREV" docker compose -f docker-compose.prod.yaml pull $APP_SERVICES
              CARWATCH_IMAGE_TAG="$PREV" docker compose -f docker-compose.prod.yaml up -d $APP_SERVICES

              for i in $(seq 1 15); do
                if docker exec carwatch-api wget -q --spider http://localhost:8080/healthz 2>/dev/null; then
                  break
                fi
                sleep 5
              done
              if ! docker exec carwatch-api wget -q --spider http://localhost:8080/healthz 2>/dev/null; then
                echo "==> Rollback API health check failed"
                exit 1
              fi
              for svc in bot-poller scraper notifier enricher; do
                container="carwatch-$svc"
                port=$(case "$svc" in
                  bot-poller) echo 8082 ;;
                  scraper) echo 8081 ;;
                  notifier) echo 8083 ;;
                  enricher) echo 8084 ;;
                esac)
                ok=0
                for i in $(seq 1 15); do
                  if docker exec "$container" wget -q --spider "http://localhost:${port}/healthz" 2>/dev/null; then
                    ok=1
                    break
                  fi
                  sleep 5
                done
                if [ "$ok" -ne 1 ]; then
                  echo "==> Rollback worker health check failed: $container"
                  exit 1
                fi
              done

              if grep -q '^CARWATCH_IMAGE_TAG=' .env; then
                sed -i "s/^CARWATCH_IMAGE_TAG=.*/CARWATCH_IMAGE_TAG=${PREV}/" .env
              else
                echo "CARWATCH_IMAGE_TAG=${PREV}" >> .env
              fi
              echo "==> Rolled back to previous version and restored .env"
              rm -f .deploy_recreate_started
              rm -f next_image_tag
            else
              echo "==> No previous image tag found, skipping rollback"
              rm -f .deploy_recreate_started
              rm -f next_image_tag
            fi
