services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: carwatch
      POSTGRES_PASSWORD: carwatch
      POSTGRES_DB: carwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
